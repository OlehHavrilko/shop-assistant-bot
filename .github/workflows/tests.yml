name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: ruff check src tests evals

  tests:
    name: tests (${{ matrix.python-version }}, ${{ matrix.extras }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        # "dev" proves the free storefront runs without the Anthropic SDK.
        extras: ["dev", "dev,llm"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[${{ matrix.extras }}]"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python evals/free_run.py
