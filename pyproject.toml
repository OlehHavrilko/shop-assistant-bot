[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-assistant-bot"
version = "1.0.0"
description = "Demonstration fabric shop catalog and Telegram assistant"
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5", "aiogram==3.31.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]
llm = ["anthropic==1.15.0"]

[project.scripts]
shop-assistant = "shop_assistant.__main__:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Long SQL schema strings and Ukrainian UI messages stay on one line.
ignore = ["E501"]
