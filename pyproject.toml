[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-assistant-bot"
version = "0.1.0"
description = "Demonstration fabric shop catalog and Telegram assistant"
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5", "aiogram==3.31.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "anthropic==1.15.0"]
llm = ["anthropic==1.15.0"]

[project.scripts]
shop-assistant = "shop_assistant.__main__:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
