name: shop-assistant-bot

services:
  bot:
    image: shop-assistant-bot:local
    build: .
    init: true
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in your environment or .env}
      MANAGER_TELEGRAM_ID: ${MANAGER_TELEGRAM_ID:?Set MANAGER_TELEGRAM_ID in your environment or .env}
      DATABASE_PATH: /data/catalog.sqlite3
      DEMO_CATALOG_PATH: ${DEMO_CATALOG_PATH:-}
      STORE_DATA_PATH: ${STORE_DATA_PATH:-/app/examples/store.json}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-}
      LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-}
      LLM_CACHE_WRITE_USD_PER_MILLION: ${LLM_CACHE_WRITE_USD_PER_MILLION:-}
      LLM_CACHE_READ_USD_PER_MILLION: ${LLM_CACHE_READ_USD_PER_MILLION:-}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-0}
      MAX_MESSAGE_LENGTH: ${MAX_MESSAGE_LENGTH:-2000}
      CLIENT_REQUESTS_PER_WINDOW: ${CLIENT_REQUESTS_PER_WINDOW:-20}
      CLIENT_RATE_WINDOW_SECONDS: ${CLIENT_RATE_WINDOW_SECONDS:-60}
      MANAGER_CONTEXT_LIMIT: ${MANAGER_CONTEXT_LIMIT:-3000}
      LLM_MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-16000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-400}
      LLM_MAX_CALLS_PER_MESSAGE: ${LLM_MAX_CALLS_PER_MESSAGE:-2}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-15}
    volumes:
      - catalog_data:/data
    stop_grace_period: 90s

volumes:
  catalog_data:
